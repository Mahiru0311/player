<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>播放器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<style>
  html, body { margin: 0; padding: 0; background: #121212; color: #eee;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
  #hint { text-align: center; color: #aaa; font-size: 15px; line-height: 1.7; padding: 48px 12px; }
  #player { margin-top: 8px; }
  .aplayer { border-radius: 12px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .aplayer .aplayer-pic { height: 120px !important; width: 120px !important; }
  .aplayer .aplayer-info { margin-left: 120px !important; height: 120px !important; padding: 14px 7px 0 14px !important; }
  .aplayer .aplayer-info .aplayer-music .aplayer-title { font-size: 17px !important; }
  .aplayer .aplayer-info .aplayer-music .aplayer-author { font-size: 13px !important; }
  .aplayer .aplayer-lrc { height: 180px; margin-top: 12px; }
  .aplayer .aplayer-lrc p { font-size: 14px; line-height: 26px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hint">加载中…</div>
  <div id="player"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script>
(function () {
  var hint = document.getElementById("hint");
  var id = new URLSearchParams(location.search).get("id") || "";
  if (!/^\d+$/.test(id)) {
    hint.textContent = "没有指定歌曲。在群里对机器人发 /网易云 <歌名>，点它给的播放链接来听。";
    return;
  }
  var api = "https://api.qijieya.cn/meting/?server=netease&type=song&id=" + encodeURIComponent(id);
  fetch(api)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (list) {
      var s = Array.isArray(list) ? list[0] : null;
      if (!s || !s.url) throw new Error("empty");
      document.title = (s.name || "歌曲") + (s.artist ? " - " + s.artist : "");
      hint.style.display = "none";
      new APlayer({
        container: document.getElementById("player"),
        theme: "#b7daff",
        lrcType: 1,
        autoplay: true,
        audio: [{
          name: s.name || "歌曲",
          artist: s.artist || "",
          url: s.url,
          cover: s.pic,
          lrc: s.lrc
        }]
      });
    })
    .catch(function () {
      hint.textContent = "加载失败，换首歌试试。";
    });
})();
</script>
</body>
</html>
